name: Main

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    needs: []
    outputs:
      image_name:  ${{ steps.vars.outputs.image_name }}
      branch_name: ${{ steps.vars.outputs.branch_name }}
    steps:
      - name: Prepare outputs for workflow jobs
        id: vars
        run: |
          TAG="${GITHUB_SHA:0:7}"
          echo "image_name=${REGISTRY}/cyber-dojo/sinatra-base:${TAG}" >> ${GITHUB_OUTPUT}
          echo "branch_name=update-base-image-${TAG}"                  >> ${GITHUB_OUTPUT}


  build-image:
    runs-on: ubuntu-latest
    needs: [setup]
    outputs:
      digest: ${{ steps.get-digest.outputs.digest }}
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - uses: cyber-dojo/pinned-checkout@main
      - uses: cyber-dojo/setup-kosli-cli@main

      # The runner is amd64, so the arm64 half of the build needs emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx pushes the manifest list directly. A multi-platform result cannot
      # be loaded into the runner's docker image store, so the registry is what
      # every later job reads the image from.
      - name: Build and push multi-arch image to ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      # Reads the digest from the registry, which names the whole multi-arch
      # index. Downstream repos pin their FROM to it, so it has to be the index
      # rather than any one platform's manifest.
      - name: Make digest available to subsequent jobs
        id: get-digest
        run: |
          DIGEST=$(kosli fingerprint "${IMAGE_NAME}" --artifact-type=oci --debug=false)
          echo "digest=${DIGEST}" >> ${GITHUB_OUTPUT}


  snyk-container-scan:
    runs-on: ubuntu-latest
    needs: [setup, build-image]
    env:
      SARIF_FILENAME: snyk.container.scan.json
      IMAGE_NAME:     ${{ needs.setup.outputs.image_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Snyk
        uses: snyk/actions/setup@master

      # Pulls from ghcr and so scans the runner's own amd64 variant of the index.
      - name: Run Snyk container scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run:
          make snyk-container-scan


  push-image-to-dockerhub:
    runs-on: ubuntu-latest
    needs: [setup, snyk-container-scan]
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
    steps:
      - uses: docker/setup-buildx-action@v3

      # Reads the public ghcr image anonymously, so only the write side of the
      # copy needs credentials.
      - name: Login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Copies the manifest list registry-to-registry, keeping both platforms.
      # Pulling and re-pushing would flatten it to the runner's own platform.
      - name: Push image to dockerhub
        run: |
          TAG="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            --tag cyberdojo/sinatra-base:${TAG} \
            "${IMAGE_NAME}"


  create-pr-on-downstream-repos:
    needs: [setup, build-image, snyk-container-scan, push-image-to-dockerhub]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.setup.outputs.image_name }}
      BRANCH_NAME: ${{ needs.setup.outputs.branch_name }}
    strategy:
      matrix:
        repo:
          - creator
          - dashboard
          - differ
          - runner
          - saver
          - spooler
          - start-points-base
          - web
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cyber-dojo/${{ matrix.repo }}
          token: ${{ secrets.BASE_IMAGE_UPGRADE }}
          fetch-depth: 0

      - name: Create branch
        run:
          git checkout -b ${BRANCH_NAME}

      # The digest names the multi-arch index, so each downstream build resolves
      # the FROM to its own platform.
      - name: Edit 1st line of Dockerfile
        env:
          BASE_IMAGE: ${{ env.IMAGE_NAME }}@sha256:${{ needs.build-image.outputs.digest }}
        run: |
          cp Dockerfile Dockerfile.original
          echo "FROM ${BASE_IMAGE} AS base" > Dockerfile
          cat Dockerfile.original | tail -n+2 >> Dockerfile
          rm Dockerfile.original

      - name: Commit
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.event.sender.login }}@users.noreply.github.com"
          git add .
          git commit --message "Dockerfile - Automated base-image update"
          git push --set-upstream origin ${BRANCH_NAME}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.BASE_IMAGE_UPGRADE }}
        run:
          gh pr create
            --base main
            --head ${BRANCH_NAME}
            --title 'Merge update-base-image into main'
            --body 'Created by Github action'
